<!doctype html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet" />
<style>
/* Layout concept: a 4:3 CRT screen floating in black, FF-blue windows, a silver-and-violet sigil identity */
:root {
  color-scheme: dark;
  --u: 2px;
  --ink: #ecebf4;
  --dim: #9a98ac;
  --win1: rgba(20, 30, 92, 0.94);
  --win2: rgba(6, 8, 30, 0.96);
  --edge: #d8dcec;
  --gold: #e8c878;
  --violet: #a880ff;
  --cyan: #70e0ff;
  --red: #ff4a5a;
  --hp: #6cf08a;
  --bg: #000;
  --title: "Cinzel", "Times New Roman", serif;
  --body: "Pixelify Sans", "VT323", ui-monospace, monospace;
  --digit: "VT323", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); }
body { font-family: var(--body); -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
#screen { position: absolute; overflow: hidden; background: #000; }
#gl { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* CRT */
#crt { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 5; }
body.crt #crt { display: block; mix-blend-mode: multiply;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--u) * 0.5), rgba(0,0,0,0.3) calc(var(--u) * 0.5), rgba(0,0,0,0.3) var(--u)),
              radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.6) 100%); }
body.crt #gl { filter: contrast(1.1) saturate(1.12) blur(0.35px); }
body.crt #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6; box-shadow: inset 0 0 calc(var(--u) * 26) rgba(0,0,0,0.85); border-radius: calc(var(--u) * 6); }

/* letterbox */
#screen::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 0; background: #000; z-index: 4; transition: height 0.6s; pointer-events: none; box-shadow: 0 calc(var(--u) * 216) 0 0 transparent; }
.lb { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 4; transition: height 0.6s ease; pointer-events: none; }
.lb.t { top: 0; } .lb.b { bottom: 0; }
body.lbox .lb { height: 12%; }
body.lbox #objective, body.lbox #bhud { opacity: 0 !important; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3; }
body.modal #hud { opacity: 0; }
#clock { display: none; }
#objective { position: absolute; top: calc(var(--u) * 8); left: calc(var(--u) * 10); right: calc(var(--u) * 10); max-width: 80%; font-size: calc(var(--u) * 7.5); line-height: 1.35;
  text-shadow: 0 1px 0 #000, 0 0 4px #000; opacity: 0; transform: translateX(calc(var(--u) * -6)); transition: opacity 0.8s, transform 0.8s; }
#objective .tag { display: block; font-size: 0.75em; color: var(--gold); letter-spacing: 0.25em; }
#objective.on { opacity: 1; transform: none; }
#objective.on.dim { opacity: 0.5; }
#prompt { position: absolute; left: 50%; bottom: calc(var(--u) * 18); transform: translate(-50%, calc(var(--u) * 4)); font-size: calc(var(--u) * 8);
  padding: calc(var(--u) * 3) calc(var(--u) * 9); background: linear-gradient(180deg, var(--win1), var(--win2)); border: 1px solid var(--edge); border-radius: calc(var(--u) * 2);
  opacity: 0; transition: 0.25s; white-space: nowrap; }
#prompt.on { opacity: 1; transform: translate(-50%, 0); }
.btnx { color: #8ab4ff; font-weight: 600; }
#whisper { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: calc(var(--u) * 10); color: #e0d8f0; letter-spacing: 0.12em;
  opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 6px #000, 0 0 2px #000, 0 0 calc(var(--u) * 8) rgba(160,120,255,0.6); font-style: italic; padding: 0 8%; }
#whisper.on { opacity: 0.9; animation: shiver 0.12s infinite; }
@keyframes shiver { 50% { transform: translateX(1px); } }
#toast { position: absolute; left: 8%; right: 8%; top: 52%; text-align: center; font-size: calc(var(--u) * 7); color: var(--cyan); opacity: 0; transition: opacity 0.4s;
  letter-spacing: 0.1em; line-height: 1.4; text-shadow: 0 0 4px #000, 0 1px 0 #000, 0 0 2px #000; }
#toast.on { opacity: 1; }
#fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 8; }
.systxt { position: absolute; left: 6%; right: 6%; top: 30%; text-align: center; font-family: var(--digit); font-size: calc(var(--u) * 12); color: var(--red);
  text-shadow: 0 0 calc(var(--u) * 6) rgba(255,40,60,0.8); animation: sysblink 0.3s steps(2) infinite; }
@keyframes sysblink { 50% { opacity: 0.4; } }

/* windows */
#ui { position: absolute; inset: 0; z-index: 7; }
.dlg { position: absolute; left: calc(var(--u) * 10); right: calc(var(--u) * 10); bottom: calc(var(--u) * 8); min-height: calc(var(--u) * 54);
  padding: calc(var(--u) * 9) calc(var(--u) * 12) calc(var(--u) * 10); background: linear-gradient(180deg, var(--win1), var(--win2));
  border: calc(var(--u) * 1) solid var(--edge); border-radius: calc(var(--u) * 3); box-shadow: 0 0 0 calc(var(--u) * 1) #000, inset 0 0 0 calc(var(--u) * 0.5) rgba(255,255,255,0.1);
  font-size: calc(var(--u) * 8.6); line-height: 1.5; cursor: pointer; animation: pop 0.16s ease-out; }
.dlg.hasface { padding-left: calc(var(--u) * 62); }
.dlg .face { position: absolute; left: calc(var(--u) * 7); top: calc(var(--u) * 7); width: calc(var(--u) * 48); height: calc(var(--u) * 48); image-rendering: pixelated;
  border: 1px solid var(--edge); background: #000; }
body.lbox .dlg { bottom: calc(12% + var(--u) * 4); }
.dlg.top { top: calc(var(--u) * 10); bottom: auto; }
@keyframes pop { from { transform: scaleY(0.2); opacity: 0; } }
.dlg .who { position: absolute; top: calc(var(--u) * -8); left: calc(var(--u) * 8); padding: calc(var(--u) * 1) calc(var(--u) * 6); background: #0a0f30;
  border: calc(var(--u) * 1) solid var(--edge); font-size: calc(var(--u) * 7); color: var(--gold); letter-spacing: 0.14em; }
.dlg.hasface .who { left: calc(var(--u) * 60); }
.dlg.narr { background: rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.16); font-style: italic; color: #dcd8e8; }
.dlg.radio { background: linear-gradient(180deg, rgba(8,40,40,0.94), rgba(2,14,16,0.96)); border-color: #70e0d0; }
.dlg.radio .who { color: #70e0d0; border-color: #70e0d0; background: #021a18; }
.dlg.mimic { background: linear-gradient(180deg, rgba(40,6,20,0.94), rgba(10,0,6,0.96)); border-color: #ff6080; color: #ffd0dc; animation: pop 0.16s, glitch 0.25s steps(2) infinite; }
.dlg.mimic .who { color: #ff6080; border-color: #ff6080; background: #200008; }
@keyframes glitch { 50% { transform: translateX(calc(var(--u) * 1)); text-shadow: calc(var(--u) * -1) 0 #f04, calc(var(--u) * 1) 0 #0ff; } }
.dlg.sys { background: rgba(20,0,0,0.9); border-color: var(--red); color: #ff8090; font-family: var(--digit); font-size: calc(var(--u) * 11); letter-spacing: 0.08em; }
.dlg .more { position: absolute; right: calc(var(--u) * 8); bottom: calc(var(--u) * 3); font-size: calc(var(--u) * 7); color: var(--gold); animation: bob 0.6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(calc(var(--u) * 2)); } }
.dlg.choice { cursor: default; padding-left: calc(var(--u) * 12); }
.dlg .q { margin-bottom: calc(var(--u) * 4); }
.opt { padding: calc(var(--u) * 1.6) calc(var(--u) * 2); cursor: pointer; color: #c0bed0; }
.opt .hand, .mrow .hand { display: inline-block; width: calc(var(--u) * 12); color: var(--gold); visibility: hidden; }
.opt.sel { color: #fff; } .opt.sel .hand, .mrow.sel .hand { visibility: visible; animation: nudge 0.5s steps(2) infinite; }
.opt.dis { opacity: 0.35; }
@keyframes nudge { 50% { transform: translateX(calc(var(--u) * 2)); } }

/* menus */
.menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,10,0.72); animation: fadeIn 0.25s; }
@keyframes fadeIn { from { opacity: 0; } }
.menu .mlist { min-width: 54%; padding: calc(var(--u) * 7) calc(var(--u) * 8); background: linear-gradient(180deg, var(--win1), var(--win2)); border: calc(var(--u) * 1) solid var(--edge);
  border-radius: calc(var(--u) * 3); box-shadow: 0 0 0 calc(var(--u) * 1) #000; max-height: 66%; overflow-y: auto; }
.menu.title { background: transparent; justify-content: flex-end; padding-bottom: calc(var(--u) * 8); }
.menu.title .mlist { min-width: 36%; padding: calc(var(--u) * 4) calc(var(--u) * 7); }
.menu.title .mrow { font-size: calc(var(--u) * 7.6); padding: calc(var(--u) * 0.8) calc(var(--u) * 3); }
.menu.title .mhint { min-height: 1.4em; margin-top: calc(var(--u) * 4); }
.mtitle { font-family: var(--title); font-weight: 700; font-size: calc(var(--u) * 12); letter-spacing: 0.3em; margin-bottom: calc(var(--u) * 8); color: var(--ink); text-shadow: 0 0 calc(var(--u) * 6) rgba(168,128,255,0.6); text-align: center; padding: 0 6%; }
.mrow { display: flex; align-items: center; font-size: calc(var(--u) * 8.6); padding: calc(var(--u) * 1.6) calc(var(--u) * 3); color: #b8b6c8; cursor: pointer; letter-spacing: 0.06em; white-space: pre; }
.mrow .lbl { flex: 1; } .mrow .val { color: #dcd8c8; font-size: 0.85em; margin-left: calc(var(--u) * 10); }
.mrow.sel { color: #fff; background: linear-gradient(90deg, rgba(232,200,120,0.16), transparent); }
.mrow.dis { opacity: 0.34; }
.mhint { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 6.6); color: var(--dim); min-height: 2.6em; max-width: 82%; text-align: center; line-height: 1.4; text-shadow: 0 1px 0 #000; }
.mfoot { margin-top: calc(var(--u) * 4); }
.pinfo, .cmdinfo { font-size: calc(var(--u) * 7); color: var(--gold); text-align: center; letter-spacing: 0.08em; }
.pinfo span { color: var(--dim); }
.menu.cmd { background: rgba(0,0,10,0.45); justify-content: flex-end; align-items: flex-end; padding: 0 calc(var(--u) * 10) calc(var(--u) * 40); }
.menu.cmd .mtitle { font-size: calc(var(--u) * 9); margin-bottom: calc(var(--u) * 4); }
.menu.cmd .mlist { min-width: 62%; }
.menu.cmd .mrow { font-size: calc(var(--u) * 7.6); }
.menu.cmd .mhint { max-width: 62%; text-align: right; }
.menu.chap .mlist { min-width: 80%; }
.menu.over { background: rgba(30,0,0,0.6); }
.menu.over .mtitle { color: #ff8090; }
.jbody { display: flex; gap: calc(var(--u) * 14); width: 86%; padding: calc(var(--u) * 8); background: linear-gradient(180deg, var(--win1), var(--win2)); border: 1px solid var(--edge); border-radius: calc(var(--u) * 3); }
.jcol { flex: 1; min-width: 0; }
.jh { font-size: calc(var(--u) * 6.5); color: var(--gold); letter-spacing: 0.25em; margin: calc(var(--u) * 5) 0 calc(var(--u) * 2); }
.jobj { font-size: calc(var(--u) * 7.6); }
.jf { font-size: calc(var(--u) * 7); line-height: 1.4; } .jf b { display: block; font-weight: 400; color: var(--dim); font-size: 0.8em; }
.jf.small { font-size: calc(var(--u) * 6.2); color: #c8c6d6; }

/* cards */
.card { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  opacity: 0; transition: opacity 0.9s; padding: calc(var(--u) * 20); }
.card.in { opacity: 1; } .card.out { opacity: 0; transition: opacity 0.6s; }
.card.lines p { margin: calc(var(--u) * 4) 0; font-size: calc(var(--u) * 9.5); line-height: 1.5; max-width: 90%; opacity: 0; animation: lineIn 1.2s forwards; }
.card.lines p:nth-child(2) { animation-delay: 1.1s; } .card.lines p:nth-child(3) { animation-delay: 2.2s; } .card.lines p:nth-child(4) { animation-delay: 3.3s; } .card.lines p:nth-child(5) { animation-delay: 4.4s; }
@keyframes lineIn { to { opacity: 1; } }
.card.lines.big p { font-family: var(--title); font-weight: 700; font-size: calc(var(--u) * 17); letter-spacing: 0.18em; text-shadow: 0 0 calc(var(--u) * 8) rgba(168,128,255,0.5); }
.card.lines.clear { background: transparent; justify-content: flex-end; padding-bottom: calc(var(--u) * 26); }
.card.lines.clear p { text-shadow: 0 0 6px #000, 0 1px 0 #000; }
.card.chap { background: radial-gradient(ellipse at center, #120c22 0%, #000 70%); }
.card.chap .cact { font-size: calc(var(--u) * 6.5); letter-spacing: 0.45em; color: var(--violet); }
.card.chap .cnum { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 8); letter-spacing: 0.6em; color: var(--dim); }
.card.chap .cline { width: 0; height: 1px; margin: calc(var(--u) * 6) auto; background: linear-gradient(90deg, transparent, var(--edge), transparent); transition: width 1.4s 0.3s; }
.card.chap.in .cline { width: 70%; }
.card.chap .ctitle { font-family: var(--title); font-weight: 900; font-size: calc(var(--u) * 18); letter-spacing: 0.08em; line-height: 1.15; text-wrap: balance;
  background: linear-gradient(180deg, #ffffff, #b8c0e0 55%, #7a70b8); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 calc(var(--u) * 6) rgba(140,110,255,0.45)); letter-spacing: 0.4em; transition: letter-spacing 2.2s ease-out; }
.card.chap.in .ctitle { letter-spacing: 0.1em; }
.card.chap .csub { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 6.8); letter-spacing: 0.3em; color: var(--gold); }

/* item viewer */
.item { position: absolute; inset: 0; background: rgba(0,0,10,0.84); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--u) * 10); animation: fadeIn 0.35s; cursor: pointer; }
.ititle { font-size: calc(var(--u) * 9); letter-spacing: 0.25em; color: var(--gold); margin-bottom: calc(var(--u) * 6); text-align: center; }
.pic { padding: calc(var(--u) * 3); background: #0a0f30; border: 1px solid var(--edge); }
.picc { width: calc(var(--u) * 96); height: calc(var(--u) * 96); image-rendering: pixelated; display: block; }
.itxt { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 8); max-width: 86%; text-align: center; line-height: 1.5; white-space: pre-line; }
.ihint { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 6.5); color: var(--dim); }

/* loading */
.loading { position: absolute; inset: 0; z-index: 9; background: #03030a; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background-image: linear-gradient(rgba(120,100,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(120,100,255,0.06) 1px, transparent 1px);
  background-size: calc(var(--u) * 16) calc(var(--u) * 16); transition: opacity 0.45s; }
.loading.out { opacity: 0; }
.loading .lart { width: calc(var(--u) * 70); height: calc(var(--u) * 70); animation: spin 9s linear infinite; filter: drop-shadow(0 0 calc(var(--u) * 6) rgba(168,128,255,0.8)); }
.loading .lart svg { width: 100%; height: 100%; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading .lgem { display: none; }
.loading .ltxt { margin-top: calc(var(--u) * 10); font-family: var(--title); font-weight: 700; letter-spacing: 0.4em; font-size: calc(var(--u) * 9); }
.loading .ltxt span { animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.6em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } }
.loading .llabel { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 6.8); color: var(--gold); letter-spacing: 0.2em; }
.loading .lbar { margin-top: calc(var(--u) * 8); width: 52%; height: calc(var(--u) * 3); background: #121230; border: 1px solid #3a3a70; }
.loading .lbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5a40c0, var(--cyan)); transition: width 0.15s; }
.loading .ltip { position: absolute; left: 8%; right: 8%; bottom: calc(var(--u) * 20); padding: calc(var(--u) * 5) calc(var(--u) * 8); font-size: calc(var(--u) * 7); line-height: 1.45;
  background: linear-gradient(180deg, var(--win1), var(--win2)); border: 1px solid var(--edge); border-radius: calc(var(--u) * 2); }
.loading .ltip b { color: var(--gold); margin-right: calc(var(--u) * 6); letter-spacing: 0.2em; font-weight: 400; }
.loading .lcard { position: absolute; bottom: calc(var(--u) * 6); right: calc(var(--u) * 8); font-size: calc(var(--u) * 5.5); color: #4a4a6a; letter-spacing: 0.15em; }

/* logo */
#logo { position: absolute; left: 0; right: 0; top: 5%; text-align: center; pointer-events: none; opacity: 0; transition: opacity 2.5s; z-index: 2; }
#logo.on { opacity: 1; }
#logo .ls { width: calc(var(--u) * 28); height: calc(var(--u) * 28); margin: 0 auto calc(var(--u) * 2); animation: spin 24s linear infinite; filter: drop-shadow(0 0 calc(var(--u) * 5) rgba(168,128,255,0.9)); }
#logo .l0 { font-size: calc(var(--u) * 5.6); letter-spacing: 0.5em; color: var(--dim); }
#logo .l1 { position: relative; font-family: var(--title); font-weight: 900; font-size: calc(var(--u) * 27); letter-spacing: 0.06em; line-height: 1; white-space: nowrap;
  background: linear-gradient(180deg, #ffffff 10%, #c8d0ec 50%, #6e64b0 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 calc(var(--u) * 1) 0 #000) drop-shadow(0 0 calc(var(--u) * 10) rgba(130,100,255,0.55)); }
#logo .l1 em { font-style: normal; position: relative; display: inline-block; animation: endsGlitch 5s infinite;
  background: linear-gradient(180deg, #ffffff 10%, #d8c8ff 50%, #8a5ae0 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
@keyframes endsGlitch { 0%, 92%, 100% { transform: none; filter: none; } 93% { transform: translateX(calc(var(--u) * 2)) skewX(-8deg); filter: hue-rotate(90deg); } 95% { transform: translateX(calc(var(--u) * -2)); } 97% { transform: none; filter: hue-rotate(-60deg); } }
#logo .l2 { margin-top: calc(var(--u) * 4); font-family: var(--title); font-weight: 500; font-size: calc(var(--u) * 7.5); letter-spacing: 0.5em; padding-left: 0.5em; color: #d8c8ff; }
#logo .l3 { width: 46%; height: 1px; margin: calc(var(--u) * 5) auto 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent); }

/* boot */
#boot { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; cursor: pointer; text-align: center; padding: 24px; }
#boot .bs { width: 92px; height: 92px; animation: spin 14s linear infinite; filter: drop-shadow(0 0 10px rgba(168,128,255,0.9)); }
#boot .bt { font-family: var(--title); font-weight: 900; font-size: 34px; letter-spacing: 0.12em; background: linear-gradient(180deg, #fff, #8a80c8); -webkit-background-clip: text; background-clip: text; color: transparent; }
#boot .bsub { font-family: var(--title); letter-spacing: 0.5em; color: #b8a8e8; font-size: 12px; }
#boot .bp { margin-top: 18px; font-size: 13px; letter-spacing: 0.3em; color: #d8d4e8; animation: sysblink 1.4s steps(2) infinite; }
#boot .bn { font-size: 11px; color: #6a6880; letter-spacing: 0.12em; line-height: 1.8; }
#boot.go { animation: bootOut 1.6s forwards; }
@keyframes bootOut { 40% { opacity: 1; filter: brightness(2); } 100% { opacity: 0; } }

/* battle HUD */
#bhud { position: absolute; inset: 0; pointer-events: none; transition: opacity 0.3s; }
.b-me, .b-allies { position: absolute; bottom: calc(var(--u) * 6); padding: calc(var(--u) * 4) calc(var(--u) * 6); background: linear-gradient(180deg, var(--win1), var(--win2));
  border: 1px solid var(--edge); border-radius: calc(var(--u) * 2); font-size: calc(var(--u) * 6.4); }
.b-me { left: calc(var(--u) * 6); width: 38%; }
.b-me.hurt { box-shadow: 0 0 calc(var(--u) * 8) rgba(255,40,60,0.9); }
.b-me.over .str i { animation: sysblink 0.3s steps(2) infinite; }
